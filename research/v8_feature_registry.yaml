# V8-FILTER-DERIVATION Phase 1 (FD3) — feature availability/timing registry.
#
# Every field that could conceivably become a V8 candidate feature is listed
# here with its availability class, source, live-deployability, and known
# leakage/coverage caveats. Built from LIVE inspection of the running
# production code (memecoin/scanner.py, research/tracker.py,
# research/smart_wallets.py, research/backfill_smart_wallets.py,
# research/snapshot.py, memecoin/progress_capture.py) and a live query
# against production Supabase (research_tokens, 33,120 rows as of
# 2026-08-15T19:00 UTC) -- not from historical docs.
#
# availability_delay_ms is the WORST-CASE observed/designed latency from
# alert receipt to the field being computable, not a guess. -1 means
# "unbounded / can be arbitrarily late" (e.g. an outcome field).
#
# Phase 2 (FD8-FD9) reads this file to decide which features a candidate
# is even allowed to use, and at what entry_delay. This file does NOT rank
# or select filters -- Phase 1 is audit-only.

schema_version: 1
generated_at: "2026-08-15T19:05:00Z"
source_git_sha: "62253be"
