    coverage_note: "0 files currently present in logs/research_paths/backfill/ on the VPS -- the backfill pipeline referenced in prior session work (K-BATCH) has produced no files under this path as of this audit. Needs investigation: did output move, or has it not been (successfully) re-run since the K3 writer-bug fix."
    leakage_risk: >
      PATH_REPRESENTATIVENESS_STATUS: CASE_CONTROL, by explicit design
      (_load_tokens selects winners/losers by outcome threshold). MUST
      NOT be used to estimate absolute win rate or $/day EV (FD17) --
      only for paired conditional exit-mechanics analysis with a known,
      documented selection scheme, or with an explicit, justified
      reweighting to the real population base rate.
    allowed_for_entry: false
    allowed_for_midtrade: true
    allowed_for_exit: true
