  # ---------------------------------------------------------------------
  # Smart money -- SMART_MONEY_NOT_ELIGIBLE_FOR_HISTORICAL_SELECTION (FD6)
  # ---------------------------------------------------------------------
  - name: smart_money_hit
    semantic: "true if any of the token's first-30-buyer wallets appear in the smart-wallet registry"
    source: research/smart_wallets.py:check_smart_money + research/tracker.py
    availability_class: T0+snapshot   # computed synchronously at insert time when it runs at all
    availability_delay_ms: 5000       # bounded by fetch_first_buyers' own Helius call latency
    live_deployable: false            # dedicated Helius call per signal, ruled out by SOCIAL_ALERT_ONLY
    coverage_note: "13076/33120 (39.5%) have ANY value; 215 True, 12861 False, 20044 NULL (never attempted)"
    leakage_risk: >
      SMART_MONEY_NOT_ELIGIBLE_FOR_HISTORICAL_SELECTION (FD6 verdict). The
      wallet registry (smart_wallets_vN.json) is built from
      research/backfill_smart_wallets.py by scanning ALL outcome-complete
      winners (pct_change_peak >= threshold) with NO temporal cutoff
      relative to any individual scored row -- a wallet earns "smart"
      status using outcome data that can postdate the very row being
      scored. backfill_smart_wallets.py additionally writes
      smart_money_hit=True directly back onto the SAME winner tokens used
      to build the wallet list (_update_supabase_rows) -- direct circular
      writeback for any row touched by that path. CONFIRMED: no
      smart_wallets_vN.json / smart_wallets_latest.json file exists
      anywhere on the VPS filesystem or in git history as of this audit
      -- the file(s) that produced the 215 True rows in current
      production data no longer exist, so provenance cannot be
      forensically verified for ANY of them. Ineligible for historical
      candidate selection until a leakage-safe, versioned,
      temporally-scoped registry exists with verifiable training_cutoff
      per row.
    allowed_for_entry: false
    allowed_for_midtrade: false
    allowed_for_exit: false

