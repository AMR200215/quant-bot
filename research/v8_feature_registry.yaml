  # ---------------------------------------------------------------------
  # Realert / re-alert fields -- leakage-risky unless reconstructed
  # ---------------------------------------------------------------------
  - name: realert_count
    semantic: "cumulative count of re-alerts for this token, AS OF QUERY TIME"
    source: research/tracker.py:_record_realert
    availability_class: POST-TRADE   # the STORED field value, as queried later, includes future realerts
    availability_delay_ms: -1
    live_deployable: true            # the CONCEPT is live-deployable; the stored historical field is not directly usable
    coverage_note: "9362/33120 (22.6%) rows have realert_count>0; top observed value 34"
    leakage_risk: >
      The row's stored realert_count reflects ALL realerts up to whenever
      the row is queried, not realerts known at any specific decision
      time. A T0-safe reconstruction MUST count only entries in
      realert_times strictly before the decision timestamp being
      evaluated -- never read the field directly as a feature. FD5
      requirement, not yet implemented -- flagged here for Phase 2.
    allowed_for_entry: false   # only the reconstructed, time-filtered version is allowed
    allowed_for_midtrade: false
    allowed_for_exit: false

  - name: realert_times
    semantic: "array of ISO timestamps, one per re-alert"
    source: research/tracker.py:_record_realert
    availability_class: T0   # each individual timestamp is legitimately T0-known once it happens
    availability_delay_ms: 0
    live_deployable: true
    coverage_note: "tracks with realert_count"
    leakage_risk: "safe to use ONLY when filtered to timestamps < decision_ts; the raw array read as a whole is a future-leakage vector identical to realert_count"
    allowed_for_entry: true   # conditional: only after time-filtering, see Phase 2 FD5 requirement
    allowed_for_midtrade: true
    allowed_for_exit: false

