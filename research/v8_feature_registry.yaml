  # ---------------------------------------------------------------------
  # Path data -- see path provenance inventory (separate artifact) for
  # forward/naturalistic vs case-control-backfill classification. Path
  # ticks themselves are POST-TRADE relative to the alert (they describe
  # what happened after), but individual ticks are legitimately T+Ns
  # available for delayed-entry / mid-trade / exit-replay use if the
  # entry timestamp is correctly aligned (FD15) -- never for a T0 decision.
  # ---------------------------------------------------------------------
  - name: path_tick (forward/naturalistic, logs/research_paths/<date>/)
    semantic: "per-second-ish price/vsol ticks written by peak_tracker.py for every tracked token"
    source: research/peak_tracker.py
    availability_class: T+Ns   # N depends on which tick; never T0
    availability_delay_ms: -1
    live_deployable: false   # research-only; replay input, not a live V8 signal
    coverage_note: "27 real (non-header-only) files total across 14 date-directories as of this audit -- severely under-populated for any n>=100 requirement. Older docs referenced ~1207 files, nearly all header-only (K-BATCH-fixed writer bug); current low real count needs its own explanation before Phase 2 -- spot-checked the VPS git-stash backlog (6 of 50 entries) for evidence of accidental loss and found none in the entries checked, not exhaustive. Status: PATH_VOLUME_GAP_UNEXPLAINED, treat as a known gap, not resolved."
    leakage_risk: "representative/naturalistic by construction (written for every tracked token, not selected by outcome) -- PATH_REPRESENTATIVENESS_STATUS: NATURALISTIC"
    allowed_for_entry: false
    allowed_for_midtrade: true
    allowed_for_exit: true

