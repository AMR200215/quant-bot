# watchdog/checks.yaml — machine-readable check registry (W4).
#
# No thresholds live in Python. Add a new managed cron job by adding a row
# here AND wrapping its cron.d command with watchdog.exec_wrapper — a job
# not wrapped will show as UNMANAGED_SCHEDULE by the static check but
# CANNOT be liveness-checked (no receipts to compare against).

managed_cron_dir: /etc/cron.d

jobs:
  - id: k5_nightly
    description: "V8 freeze-gate nightly refresh (report.py + path_stats.py)"
    cron_file: quantbot-v8-inputs
    schedule: "15 0 * * *"
    grace_minutes: 45
    output_artifact: docs/V8_INPUTS.md
    severity: WARN
    profile: fast
    runbook: |
      journalctl -u cron --since "-2h" | grep -i "quantbot-v8-inputs\|bad minute\|syntax"
      cat /etc/cron.d/quantbot-v8-inputs
      sqlite3 logs/watchdog/state.db "select * from job_receipts where job_id='k5_nightly' order by started_at desc limit 5;"

  - id: epoch_daily
    description: "Epoch capital-decision daily PnL/trade log"
    cron_file: quantbot-epoch
    schedule: "55 23 * * *"
    grace_minutes: 45
    output_artifact: logs/epoch_daily.jsonl
    severity: WARN
    profile: fast
    runbook: |
      journalctl -u cron --since "-2h" | grep -i "quantbot-epoch\|bad minute\|syntax"
      cat /etc/cron.d/quantbot-epoch
      sqlite3 logs/watchdog/state.db "select * from job_receipts where job_id='epoch_daily' order by started_at desc limit 5;"

  - id: v8_vs_v7_daily
    description: "V8 vs V7 daily comparison log"
    cron_file: quantbot-v8
    schedule: "58 23 * * *"
    grace_minutes: 45
    output_artifact: "docs/RECEIPTS.md (N6/N7 table row)"
    severity: WARN
    profile: fast
    runbook: |
      journalctl -u cron --since "-2h" | grep -i "quantbot-v8 \|bad minute\|syntax"
      cat /etc/cron.d/quantbot-v8
      sqlite3 logs/watchdog/state.db "select * from job_receipts where job_id='v8_vs_v7_daily' order by started_at desc limit 5;"

# W7 (Phase 2): funnel stuck-stage / silent-disappearance detection.
# Reuses logs/v8_funnel.jsonl (built for V8-TWIN-FIX) -- no new
# instrumentation, no trading-path change.
funnels:
  - id: v8
    description: "V8 candidate funnel terminal-disposition completeness"
    funnel_path: logs/v8_funnel.jsonl
    grace_seconds: 120
    severity: CRITICAL
    profile: fast
    runbook: |
      tail -50 logs/v8_funnel.jsonl
      journalctl -u quantbot --since "-1h" | grep -i "v8_paper\|v8_gate"

# W6B (Phase 2): feed liveness. Zero app-code changes -- both evidence
# sources (journalctl self-reported states, v8_funnel.jsonl's
# telegram_received stage) already exist.
feeds:
  - id: telegram
    description: "Telegram monitor liveness (sole signal source in SOCIAL_ALERT_ONLY mode)"
    funnel_path: logs/v8_funnel.jsonl
    stale_threshold_minutes: 120
    severity: CRITICAL
    profile: fast
    runbook: |
      journalctl -u quantbot --since "-2h" | grep -i "telegram\|tg-monitor\|tg-watchdog"
      python3 -c "from memecoin.telegram_monitor import get_tg_state; print(get_tg_state())"

  - id: pumpportal
    description: "PumpPortal real-time tick feed liveness (V8 progress capture + future live monitoring)"
    severity: CRITICAL
    profile: fast
    runbook: |
      journalctl -u quantbot --since "-1h" | grep -i "pumpportal websocket\|pumpportal ws error\|tick deadman"

# W6D (Phase 3): research pipeline upstream-flowing/downstream-stalled
# detection. Reuses existing on-disk queue/offset/spool files -- no new
# instrumentation, separate systemd unit (quantbot-research.service) from
# the main trading app.
pipelines:
  - id: research_queue_lag
    description: "signal_queue.jsonl consumer lag (research.tg_listener.FileQueueListener)"
    queue_path: research/data/signal_queue.jsonl
    offset_path: research/data/.queue_offset
    severity: WARN
    profile: fast
    runbook: |
      echo "size:"; stat -c%s research/data/signal_queue.jsonl
      echo "offset:"; cat research/data/.queue_offset
      systemctl status quantbot-research.service --no-pager -l

  - id: research_spool
    description: "Supabase insert-failure spool growth (research/spool/failed_inserts.jsonl)"
    failed_inserts_path: research/spool/failed_inserts.jsonl
    lookback_hours: 2
    severity: WARN
    profile: fast
    runbook: |
      tail -20 research/spool/failed_inserts.jsonl

# W8 (Phase 4): test-suite drift. Heavier than the fast-profile checks
# (AST scan across the whole test tree + subprocess pytest --collect-only
# per directory, ~2s combined) -- slow/hourly profile, not fast/5-min.
test_drift:
  - id: stale_mocks
    description: "patch()/patch.object() targets that no longer exist in their resolved module (static AST only)"
    severity: WARN
    profile: slow
    runbook: |
      python3 -m watchdog.checks.test_drift  # not a CLI yet -- see evidence.findings in check_results

  - id: collection
    description: "pytest --collect-only per test directory (memecoin/tests, research/tests, watchdog/tests, tests/), run separately -- the combined tree has a pre-existing, unrelated sys.modules stubbing collision across some files"
    severity: WARN
    profile: slow
    runbook: |
      .venv/bin/python -m pytest --collect-only -q memecoin/tests
      .venv/bin/python -m pytest --collect-only -q research/tests
      .venv/bin/python -m pytest --collect-only -q watchdog/tests
      .venv/bin/python -m pytest --collect-only -q tests

# W9 (Phase 4): claim-vs-artifact verification. batches/*.yaml (via
# tools/batch_verify.py, already returns a structured verdict dict --
# no new claims registry needed) already distinguishes GREEN/PARTIAL/FAIL;
# this makes that distinction continuously monitored instead of only
# visible to someone reading `--verbose` output by hand.
claims:
  - id: batch_verify
    description: "batches/*.yaml claim-vs-RECEIPTS.md verification -- PARTIAL is not GREEN even though batch_verify's own CLI exits 0 for both"
    severity: WARN
    profile: slow
    runbook: |
      .venv/bin/python -m tools.batch_verify --all --verbose

# W17 (Phase 5): reciprocal supervision -- Layer 1 watches whether Layer 2
# (the externally-scheduled LLM audit agent, GitHub Actions) has gone
# stale. Reads logs/watchdog/layer2_heartbeat.json, committed by Layer 2
# and picked up locally via the VPS's existing git pull cron (9am/6pm) --
# that cadence is the real visibility latency, documented not engineered
# around. WARN not CRITICAL by default: Layer 2 going stale degrades
# defense-in-depth, it doesn't itself mean anything in production broke.
layer2:
  - id: staleness
    description: "Layer 2 (external LLM audit agent) last-successful-audit age"
    stale_threshold_hours: 30
    severity: WARN
    profile: slow
    runbook: |
      cat logs/watchdog/layer2_heartbeat.json 2>/dev/null || echo "no heartbeat yet"
      gh run list --workflow=layer2-audit.yml --limit 5  # once the workflow exists

# V8-FD Phase 1.5 (P15-7): research path-collection yield, the data
# full-strategy EV (FD14/FD15/FD17) depends on. Root-caused live: the
# daily PumpPortal message budget gets exceeded most days, silently
# dropping newly-scheduled tokens for the rest of the UTC day. WARN, not
# CRITICAL -- known, cost-bounded constraint (raising the budget spends
# real SOL, a user decision), not a code bug. The more severe zero-ticks-
# all-day case already pages via research/peak_tracker.py's own
# send_alert-based FAIL, independent of this check.
path_collection:
  - id: daily_yield
    description: "research path-collection daily yield vs PumpPortal message budget"
    stale_threshold_hours: 30
    severity: WARN
    profile: slow
    runbook: |
      cat logs/watchdog/path_collection_daily.json 2>/dev/null || echo "no status yet"
      journalctl -u quantbot-research --since "-25h" | grep "PeakTracker DAY REPORT"
